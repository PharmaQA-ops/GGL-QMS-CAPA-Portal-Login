<title>QMS Portal | Login</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #101820;
    }

    /* ================================
       BACKGROUND VIDEO
    ================================= */

    .video-background {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101820;
        z-index: 0;
    }

    .video-background video {
        position: absolute;
        top: 50%;
        left: 50%;

        width: 100%;
        height: 100%;

        min-width: 100%;
        min-height: 100%;

        transform: translate(-50%, -50%);

        object-fit: cover;

        pointer-events: none;
    }

    /* ================================
       VIDEO OVERLAY
    ================================= */

    .video-overlay {
        position: fixed;
        inset: 0;

        background:
            linear-gradient(
                90deg,
                rgba(5, 15, 25, 0.72),
                rgba(5, 15, 25, 0.38)
            );

        z-index: 1;
    }

    /* ================================
       PAGE
    ================================= */

    .page {
        position: relative;

        width: 100%;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        z-index: 2;
    }

    /* ================================
       LOGIN CARD
    ================================= */

    .login-card {
        width: 100%;
        max-width: 430px;

        padding: 42px;

        background: rgba(255, 255, 255, 0.96);

        border: 1px solid rgba(255, 255, 255, 0.75);

        border-radius: 18px;

        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.35);

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    /* ================================
       BRAND
    ================================= */

    .brand {
        text-align: center;
        margin-bottom: 30px;
    }

    .brand-logo {
        display: block;

        width: auto;
        max-width: 230px;
        max-height: 90px;

        object-fit: contain;

        margin: 0 auto 22px;
    }

    .brand h1 {
        color: #17365d;

        font-size: 24px;
        font-weight: 700;

        line-height: 1.25;

        margin-bottom: 8px;
    }

    .brand p {
        color: #6b7280;

        font-size: 13px;
        line-height: 1.5;
    }

    /* ================================
       FORM
    ================================= */

    .form-group {
        margin-bottom: 19px;
    }

    .form-group label {
        display: block;

        margin-bottom: 8px;

        color: #374151;

        font-size: 13px;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        height: 47px;

        padding: 0 14px;

        border: 1px solid #d1d5db;
        border-radius: 8px;

        outline: none;

        background: #ffffff;
        color: #1f2937;

        font-size: 14px;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .form-group input::placeholder {
        color: #9ca3af;
    }

    .form-group input:focus {
        border-color: #17365d;

        box-shadow:
            0 0 0 3px rgba(23, 54, 93, 0.10);
    }

    /* ================================
       PASSWORD
    ================================= */

    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-right: 65px;
    }

    .show-password {
        position: absolute;

        right: 12px;
        top: 50%;

        transform: translateY(-50%);

        border: none;
        background: transparent;

        color: #17365d;

        font-size: 12px;
        font-weight: 600;

        cursor: pointer;
    }

    /* ================================
       LOGIN BUTTON
    ================================= */

    .login-button {
        width: 100%;
        height: 48px;

        margin-top: 5px;

        border: none;
        border-radius: 8px;

        background: #17365d;
        color: #ffffff;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;

        transition:
            background 0.2s ease,
            transform 0.1s ease;
    }

    .login-button:hover {
        background: #102a49;
    }

    .login-button:active {
        transform: translateY(1px);
    }

    .login-button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
    }

    /* ================================
       MESSAGE
    ================================= */

    .message {
        display: none;

        margin-top: 15px;
        padding: 11px 13px;

        border-radius: 7px;

        font-size: 12px;
        line-height: 1.4;
    }

    .message.error {
        display: block;

        background: #fef2f2;
        color: #b91c1c;

        border: 1px solid #fecaca;
    }

    .message.success {
        display: block;

        background: #f0fdf4;
        color: #15803d;

        border: 1px solid #bbf7d0;
    }

    /* ================================
       FOOTER
    ================================= */

    .footer {
        text-align: center;

        margin-top: 25px;

        color: #9ca3af;

        font-size: 11px;
        line-height: 1.6;
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

        .page {
            padding: 18px;
        }

        .login-card {
            padding: 30px 24px;
            border-radius: 14px;
        }

        .brand-logo {
            max-width: 190px;
            max-height: 75px;
        }

        .brand h1 {
            font-size: 21px;
        }

        .video-overlay {
            background:
                rgba(5, 15, 25, 0.60);
        }
    }

    /* ================================
       REDUCED MOTION
    ================================= */

    @media (prefers-reduced-motion: reduce) {

        .video-background video {
            display: none;
        }

        .video-background {
            background: #17365d;
        }
    }
</style>
```

</head>

<body>

```
<!-- BACKGROUND VIDEO -->

<div class="video-background">

    <video
        id="backgroundVideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto">

        <source
            src="https://raw.githubusercontent.com/PharmaQA-ops/library/a3daff9d80bd6d04c3811c5fb9a130c50ca15c81/Pharmaceutical_logistics_global_%E2%80%A6_1080p_20260910150219.mp4"
            type="video/mp4">

    </video>

</div>


<!-- VIDEO OVERLAY -->

<div class="video-overlay"></div>


<!-- LOGIN -->

<main class="page">

    <section class="login-card">

        <div class="brand">

            <img
                class="brand-logo"
                src="https://raw.githubusercontent.com/PharmaQA-ops/ggl-main-dashboard/0c277ecd7fd7fec44cc271288154a2e8b67856fe/logo.png"
                alt="Gaerish Logistics">

            <h1>
                Quality Management Portal
            </h1>

            <p>
                Complaint, Investigation &amp; CAPA Management
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email / User ID
                </label>

                <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="Enter your email or user ID"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        id="togglePassword">

                        Show

                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton">

                Sign In

            </button>


            <div
                id="loginMessage"
                class="message">
            </div>

        </form>


        <div class="footer">

            Internal Quality Management System<br>
            Complaint &amp; CAPA Management Portal

        </div>

    </section>

</main>


<script>

    /* ================================
       PASSWORD VISIBILITY
    ================================= */

    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    togglePassword.addEventListener(
        "click",
        function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                togglePassword.textContent = "Hide";

            } else {

                passwordInput.type = "password";
                togglePassword.textContent = "Show";

            }

        }
    );


    /* ================================
       LOGIN
    ================================= */

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const loginMessage =
        document.getElementById("loginMessage");

    loginForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            const email =
                document.getElementById("email")
                .value
                .trim();

            const password =
                document.getElementById("password")
                .value;

            loginMessage.className = "message";
            loginMessage.textContent = "";

            if (!email || !password) {

                loginMessage.className =
                    "message error";

                loginMessage.textContent =
                    "Please enter your login credentials.";

                return;
            }

            /*
             * AUTHENTICATION WILL BE CONNECTED LATER
             *
             * GitHub
             *    ↓
             * Apps Script API
             *    ↓
             * USERS sheet
             *    ↓
             * Validate user
             *    ↓
             * ADMIN / USER
             */

            loginButton.disabled = true;
            loginButton.textContent = "Signing In...";

            setTimeout(function () {

                loginButton.disabled = false;
                loginButton.textContent = "Sign In";

                loginMessage.className =
                    "message error";

                loginMessage.textContent =
                    "Authentication is not connected yet.";

            }, 700);

        }
    );


    /* ================================
       VIDEO AUTOPLAY
    ================================= */

    const backgroundVideo =
        document.getElementById("backgroundVideo");

    backgroundVideo.play().catch(function () {

        console.log(
            "Background video autoplay was blocked."
        );

    });

</script>
```
